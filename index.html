<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Salesforce Messaging Test</title>
</head>
<body>

  <!-- Salesforce container -->
  <div id="embedded-messaging"></div>

  <script>
    function initEmbeddedMessaging() {
      try {
        embeddedservice_bootstrap.settings.language = 'en_US';

        embeddedservice_bootstrap.init(
          '00Dez000000552H',  // Org ID
          'PCC_Service_Agent_Channel', // Deployment Name
          'https://force-connect-7550--pcextendev.sandbox.my.site.com/ESWPCCServiceAgentChan1766436051648', // SCRT URL
          {
            scrt2URL: 'https://force-connect-7550--pcextendev.sandbox.my.salesforce-scrt.com'
          }
        );
      } catch (err) {
        console.error('Error loading Embedded Messaging: ', err);
      }
    }

    // Load bootstrap script
    (function() {
      var script = document.createElement('script');
      script.src = 'https://force-connect-7550--pcextendev.sandbox.my.site.com/ESWPCCServiceAgentChan1766436051648/assets/js/bootstrap.min.js';
      script.onload = function() {
        initEmbeddedMessaging();
      };
      document.body.appendChild(script);
    })();
  </script>

</body>
</html>
